<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辦公室飲料揪團訂購系統 🧋</title>
    <!-- Google Fonts: Plus Jakarta Sans for ultimate geometric layout precision -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

    <!-- Tailwind CSS v3 CDN -->

    <!-- Tailwind Custom Configuration -->
    <script>
      tailwind.config = {

              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              matcha: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981', // Geometric Balance Primary Emerald Green
                600: '#059669',
                700: '#047857',
                800: '#065f46', // Primary Dark Emerald Green
                900: '#064e3b',
              },
              boba: {
                50: '#fffbeb',
                100: '#fef3c7', // Sugar warm background
                200: '#fde68a',
                300: '#fcd34d',
                400: '#fbbf24',

                800: '#92400e',
                900: '#78350f',
              }

            boxShadow: {
              'premium': '0 4px 10px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
              'premium-hover': '0 10px 20px -3px rgba(16, 185, 129, 0.1), 0 4px 6px -2px rgba(16, 185, 129, 0.05)',
              'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
            }
          }

      }
    </script>
    
    <style type="text/css">
      /* Geometric background pattern */
      .geo-grid {
        position: fixed;
        inset: 0;
        background-color: #f4f7f6; /* Geometric Balance Neutral Bg */
        background-image: 
          linear-gradient(to right, rgba(16, 185, 129, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(16, 185, 129, 0.02) 1px, transparent 1px);
        background-size: 30px 30px;
        z-index: 0;
        pointer-events: none;
      }
      .geo-circle {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(16, 185, 129, 0.06);
        pointer-events: none;
      }
      
      /* Smooth transitions */
      .smooth-transition {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Custom animations */
      @keyframes pulse-subtle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .85; transform: scale(0.98); }
      }
      .animate-pulse-subtle {
        animation: pulse-subtle 2s infinite ease-in-out;
      }
      
      @keyframes bounce-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .animate-bounce-slow {
        animation: bounce-slow 3s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-[#f4f7f6] text-slate-800 min-h-screen relative overflow-x-hidden font-sans">
    
    <!-- Decorative Geometric Clean Background Grid -->
    <div class="geo-grid fixed inset-0 z-0">
      <div class="geo-circle" style="left: 5%; top: 15%; width: 150px; height: 150px;"></div>
      <div class="geo-circle" style="right: 8%; top: 35%; width: 220px; height: 220px;"></div>
      <div class="geo-circle" style="left: 15%; bottom: 10%; width: 130px; height: 130px;"></div>
      <div class="geo-circle" style="right: 20%; bottom: 15%; width: 180px; height: 180px;"></div>
    </div>

    <!-- Application Root Element -->
    <div id="root" class="relative z-10"></div>

    <!-- React Implementation Block -->
    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // API Google Apps Script Endpoint Web App (As URL provided by the user)
      const API_URL = "https://script.google.com/macros/s/AKfycby4uKE67C0iey0Jt0BefVIIKoZpPYmHEy-hS9idAzRPAwXXy2SmjpLjhM36HA9RUt74/exec";

      // Premium Mock menu as a perfect fallback if the API hasn't loaded or is empty.
      const DEFAULT_MENU = [
        { name: "珍珠厚鮮牛奶茶", price: 65, category: "鮮奶茶類", description: "香濃黑糖手作珍珠，搭配頂級特濃光泉鮮乳，濃醇回甘。" },
        { name: "芋頭椰果西米露", price: 70, category: "暖胃甜品類", description: "手搗濃密大甲芋頭泥，完美搭配 Q 彈椰果與香滑西米露。" },
        { name: "翡翠檸檬玉露", price: 55, category: "清爽鮮果茶", description: "黃金比例的新鮮現壓檸檬原汁，清透解膩的午茶爽口必備。" },
        { name: "古早味黑糖珍奶", price: 55, category: "濃厚奶茶類", description: "慢火熬烏黑糖蜜，裹勻滾熱珍珠，完美點綴經典英式紅茶底。" },
        { name: "茉香翠綠茶", price: 35, category: "經典原味茶", description: "特選新鮮茉莉花低溫多重慢薰，茶湯呈清漾碧玉色澤。" },
        { name: "嚴選四季青茶", price: 35, category: "經典原味茶", description: "香氣清爽高雅，入喉順口不澀，辦公室最耐喝的原茶推薦。" },
        { name: "百香雙Q綠茶", price: 60, category: "清爽鮮果茶", description: "新鮮百香果粒，驚喜加入脆口蘆薈與香軟椰果，雙倍咀嚼享受。" },
        { name: "芒果椰奶冰沙", price: 80, category: "清透冰沙類", description: "當季優鮮芒果泥，淋上椰奶與雪白香草奶蓋，熱烈夏天消暑巨星。" },
        { name: "芝芝可可燕麥奶", price: 75, category: "濃厚奶茶類", description: "特濃比利時黑可可融合優質燕麥乳，附上鹹甜芝士厚奶蓋。" }
      ];

      // Custom SVGs corresponding to Lucide icons to avoid fetching and breaking inside sandbox
      function Icon({ name, className = "w-5 h-5", ...props }) {
        const icons = {
          coffee: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <path d="M17 8h1a4 4 0 1 1 0 8h-1" />

          ),

              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          ),
          minus: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          ),
          edit: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          ),
          trash: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <path d="M3 6h18" />
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />

          ),
          refresh: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M3 21v-5h5" />
            </svg>
          ),
          user: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          ),
          shoppingBag: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          ),
          trendingUp: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
              <polyline points="16 7 22 7 22 13" />
            </svg>
          ),
          dollarSign: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <line x1="12" y1="1" x2="12" y2="23" />
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />

          ),
          search: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          ),
          check: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <polyline points="20 6 9 17 4 12" />
            </svg>
          ),
          info: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="16" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
          ),
          x: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          ),
          sparkles: (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z" />
              <path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5Z" />
              <path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z" />
            </svg>
          ),
          loading: (
            <svg className={`animate-spin ${className}`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" {...props}>
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          )
        };
        return icons[name] || null;
      }

      // --- Toast Notification System ---
      function ToastContainer({ toasts, removeToast }) {
        return (
          <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-md w-full pointer-events-none">
            {toasts.map((toast) => {
              const bgColors = {
                success: 'bg-[#f0f9f4] border-emerald-100 text-emerald-800 shadow-emerald-100/50',
                error: 'bg-[#fef2f2] border-red-100 text-red-800 shadow-red-100/50',
                info: 'bg-[#f4faff] border-sky-100 text-sky-800 shadow-sky-100/50'
              };
              const iconColors = {
                success: 'text-emerald-500',
                error: 'text-red-500',
                info: 'text-sky-500'
              };

              return (
                <div
                  key={toast.id}
                  className={`pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-xl border shadow-lg smooth-transition translate-y-0 opacity-100 transform ${bgColors[toast.type] || bgColors.info} border`}
                  style={{ animation: 'bounce-slow 3s infinite ease-in-out' }}
                >
                  <div className={`flex-shrink-0 ${iconColors[toast.type] || iconColors.info}`}>
                    {toast.type === 'success' && <Icon name="check" className="w-5 h-5 bg-emerald-100 rounded-full p-0.5" />}
                    {toast.type === 'error' && <Icon name="x" className="w-5 h-5 bg-red-100 rounded-full p-0.5" />}
                    {toast.type === 'info' && <Icon name="info" className="w-5 h-5 bg-sky-100 rounded-full p-0.5" />}
                  </div>
                  <div className="flex-grow text-sm font-medium tracking-wide">
                    {toast.message}
                  </div>
                  <button
                    onClick={() => removeToast(toast.id)}
                    className="flex-shrink-0 text-stone-400 hover:text-stone-600 smooth-transition p-1"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
              );
            })}
          </div>
        );
      }

      // --- Main Order Form Component ---
      function OrderForm({ 
        menu, 
        formState, 
        setFormState, 
        isSubmitting, 
        onSubmit, 
        onCancelEdit,
        editOrderId,
        addToast
      }) {
        const sugarLevels = ["無糖", "微糖", "半糖", "七分糖", "正常糖"];
        const iceLevels = ["去冰", "微冰", "少冰", "正常冰", "溫熱"];
        const formRef = useRef(null);

        // Highlight form momentarily when a beverage is chosen via fast menu
        useEffect(() => {
          if (formState.drink && formRef.current) {
            formRef.current.classList.add('ring-4', 'ring-matcha-200');
            const timer = setTimeout(() => {
              if (formRef.current) {
                formRef.current.classList.remove('ring-4', 'ring-matcha-200');
              }
            }, 600);
            return () => clearTimeout(timer);
          }
        }, [formState.drink]);

        const handleQuantityChange = (val) => {
          const newQty = Math.max(1, formState.quantity + val);
          const priceMultiplier = parseFloat(formState.price) || 0;
          setFormState({
            ...formState,
            quantity: newQty,
            totalPrice: newQty * priceMultiplier
          });
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!formState.name.trim()) {
            addToast("請填寫訂購人姓名！", "error");
            return;
          }
          if (!formState.drink) {
            addToast("請選擇想喝的飲料！", "error");
            return;
          }
          onSubmit();
        };

        // Find standard price of currently selected drink
        const matchedDrink = useMemo(() => {
          return menu.find(item => item.name === formState.drink);
        }, [menu, formState.drink]);

        return (
          <div 
            ref={formRef}
            className="bg-white rounded-2xl p-6 shadow-premium border border-slate-200 smooth-transition"
          >
            <div className="flex items-center justify-between mb-5 select-none">
              <div className={`flex items-center gap-2 pl-3 border-l-4 ${editOrderId ? 'border-amber-500' : 'border-matcha-500'}`}>
                <h3 className="text-lg font-bold tracking-tight text-slate-800">
                  {editOrderId ? '✏️ 修改飲品' : '📝 新填點單'}
                </h3>
              </div>
              {editOrderId && (
                <span className="text-xs bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full font-medium flex items-center gap-1">
                  編輯中...
                </span>
              )}
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              {/* Name Field */}
              <div>
                <label className="block text-xs font-semibold tracking-wider text-stone-500 uppercase mb-2">
                  1. 訂購人姓名 <span className="text-red-500">*</span>
                </label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400">
                    <Icon name="user" className="w-4 h-4" />
                  </div>
                  <input
                    type="text"
                    required
                    value={formState.name}
                    onChange={(e) => setFormState({ ...formState, name: e.target.value })}
                    placeholder="請輸入您的姓名或綽號 (例如: 小美)"
                    className="w-full pl-9 pr-4 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:border-matcha-500 focus:bg-white smooth-transition text-stone-800 font-medium"
                  />
                </div>
              </div>

              {/* Selected Drink Display */}
              <div>
                <label className="block text-xs font-semibold tracking-wider text-stone-500 uppercase mb-2">
                  2. 已選飲品 <span className="text-red-500">*</span>
                </label>
                {formState.drink ? (
                  <div className="p-3.5 bg-matcha-50/60 rounded-xl border border-matcha-100/50 flex justify-between items-center relative overflow-hidden group">
                    <div className="absolute top-0 right-0 p-1 opacity-10">
                      <Icon name="coffee" className="w-20 h-20 text-matcha-600 translate-x-4 translate-y-2" />
                    </div>
                    <div className="relative z-10">
                      <div className="font-bold text-stone-800 text-sm tracking-wide">
                        {formState.drink}
                      </div>
                      <div className="text-xs text-stone-500 mt-1 max-w-[200px] truncate">
                        {matchedDrink?.description || "經典推薦招牌配方，口感絕配辦公室首選。"}
                      </div>
                    </div>
                    <div className="text-right relative z-10">
                      <span className="text-[10px] text-matcha-600/70 font-bold block">單價</span>
                      <span className="font-mono text-sm font-bold text-matcha-700">NT$ {formState.price}</span>
                    </div>
                  </div>
                ) : (
                  <div className="p-4 border-2 border-dashed border-stone-200 rounded-xl text-center text-stone-400 text-xs py-5">
                    請在右側「飲料菜單」點擊一杯飲料加載入單！
                  </div>
                )}
              </div>

              {/* Sugar Level Custom Pill Selector */}
              <div>
                <label className="block text-xs font-bold tracking-wider text-slate-500 uppercase mb-2">
                  3. 甜度調整
                </label>
                <div className="grid grid-cols-5 gap-1.5 bg-slate-50 p-1 rounded-xl border border-slate-200/80">
                  {sugarLevels.map((lvl) => {
                    const isSelected = formState.sugar === lvl;
                    return (
                      <button
                        type="button"
                        key={lvl}
                        onClick={() => setFormState({ ...formState, sugar: lvl })}
                        className={`py-1.5 rounded-lg text-xs font-bold transition-all smooth-transition ${
                          isSelected 
                            ? 'bg-matcha-500 text-white border border-matcha-500 shadow-sm scale-[1.02]' 
                            : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300'
                        }`}
                      >
                        {lvl}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Ice Level Custom Pill Selector */}
              <div>
                <label className="block text-xs font-bold tracking-wider text-slate-500 uppercase mb-2">

      // --- Main Dashboard App Component ---
      function App() {
        // Core Web states
        const [orders, setOrders] = useState([]);
        const [menu, setMenu] = useState(DEFAULT_MENU);
        const [isLoading, setIsLoading] = useState(true);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [isDeletingId, setIsDeletingId] = useState(null);
        
        // Form & Editing States
        const [formState, setFormState] = useState({
          name: "",
          drink: "",
          sugar: "半糖",
          ice: "少冰",
          quantity: 1,
          price: 0,
          totalPrice: 0
        });
        const [editOrderId, setEditOrderId] = useState(null);

        // Filter / Search states
        const [searchQuery, setSearchQuery] = useState("");
        const [selectedCategory, setSelectedCategory] = useState("全部");

        // Toast states
        const [toasts, setToasts] = useState([]);

        // Form input auto-persister for user convenience on reload
        useEffect(() => {
          const savedName = localStorage.getItem("boba_orderer_name");
          if (savedName) {
            setFormState(prev => ({ ...prev, name: savedName }));
          }
        }, []);

        // Notification handler
        const addToast = (message, type = "info") => {
          const id = Date.now() + Math.random().toString(36).substring(2, 7);
          setToasts(prev => [...prev, { id, message, type }]);
          
          // Auto remove after 3s
          setTimeout(() => {
            setToasts(prev => prev.filter(t => t.id !== id));
          }, 3500);
        };

        const removeToast = (id) => {
          setToasts(prev => prev.filter(t => t.id !== id));
        };

        // Get live orders list and standard dynamic menus
        const fetchData = async (isManual = false) => {
          setIsLoading(true);
          try {
            const resp = await fetch(API_URL);
            const resData = await resp.json();
            
            // Handle retrieved menu
            if (resData.menu && resData.menu.length > 0) {
              setMenu(resData.menu);
            } else {
              // Fallback menu when sheets don't exist
              setMenu(DEFAULT_MENU);
            }

            // Handle retrieved orders
            if (resData.orders) {
              setOrders(resData.orders);
            } else {
              setOrders([]);
            }

            if (isManual) {
              addToast("成功同步最新點單與菜單！", "success");
            }
          } catch (err) {
            console.error("API error", err);
            addToast("連線 Google Apps Script 失敗。已加載本地預載設定以保證順暢運作！", "info");
            // If API fails, ensure fallback menu is loaded
            setMenu(DEFAULT_MENU);
          } finally {
            setIsLoading(false);
          }
        };

        // Trigger on load
        useEffect(() => {
          fetchData();
        }, []);

        // Search and Categorization logic
        const menuCategories = useMemo(() => {
          const cats = new Set(menu.map(item => item.category));
          return ["全部", ...Array.from(cats).filter(Boolean)];
        }, [menu]);

        const filteredMenu = useMemo(() => {
          return menu.filter(item => {
            const matchesQuery = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                 (item.description && item.description.toLowerCase().includes(searchQuery.toLowerCase()));
            const matchesCat = selectedCategory === "全部" || item.category === selectedCategory;
            return matchesQuery && matchesCat;
          });
        }, [menu, searchQuery, selectedCategory]);

        // Form selection trigger from beverage card
        const handleSelectDrink = (bev) => {
          setFormState(prev => ({
            ...prev,
            drink: bev.name,
            price: bev.price,
            totalPrice: prev.quantity * bev.price
          }));
          addToast(`已載入飲品：${bev.name} (NT$ ${bev.price})`, "success");
        };

        // Statistics computation in real-time
        const statistics = useMemo(() => {
          const totalCups = orders.reduce((sum, o) => sum + (o.quantity || 0), 0);
          const totalAmount = orders.reduce((sum, o) => sum + (o.totalPrice || 0), 0);
          const uniqueNames = new Set(orders.map(o => o.name.trim()).filter(Boolean));
          
          // Popular computation
          const popularity = {};
          orders.forEach(o => {
            if (o.drink) {
              popularity[o.drink] = (popularity[o.drink] || 0) + o.quantity;
            }
          });
          let hotDrinkName = "-";
          let hotDrinkCount = 0;
          Object.entries(popularity).forEach(([name, count]) => {
            if (count > hotDrinkCount) {
              hotDrinkName = name;
              hotDrinkCount = count;
            }
          });

          return {
            totalCups,
            totalAmount,
            peopleCount: uniqueNames.size,
            popularText: hotDrinkCount > 0 ? `${hotDrinkName} (${hotDrinkCount}杯)` : "無"
          };
        }, [orders]);

        // Form Submit Actions
        const handleFormSubmit = async () => {
          setIsSubmitting(true);
          
          // Save orderer name in localstorage
          localStorage.setItem("boba_orderer_name", formState.name.trim());

          const action = editOrderId ? "update" : "create";
          const payload = {
            action: action,
            data: {
              orderId: editOrderId,
              name: formState.name.trim(),
              drink: formState.drink,
              sugar: formState.sugar,
              ice: formState.ice,
              quantity: formState.quantity,
              totalPrice: formState.totalPrice
            }
          };

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === "success") {
              addToast(editOrderId ? "點單內容修改成功！" : "美味飲料已送出，快遞給工作表紀錄！", "success");
              // Clear state including current user name
              setFormState({
                name: "",
                drink: "",
                price: 0,
                totalPrice: 0,
                quantity: 1,
                sugar: "半糖",
                ice: "少冰"
              });
              setEditOrderId(null);
              // Fetch latest orders
              fetchData();
            } else {
              addToast(`GAS 錯誤: ${result.message}`, "error");
            }
          } catch (err) {
            console.error("Post error", err);
            addToast("連線後端錯誤。請檢查您的網路或確認 GAS 配額。", "error");
          } finally {
            setIsSubmitting(false);
          }
        };

        // Form Edit loader
        const handleEdit = (order) => {
          const matched = menu.find(item => item.name === order.drink);
          const singlePrice = matched ? matched.price : Math.round(order.totalPrice / order.quantity);

          setEditOrderId(order.orderId);
          setFormState({
            name: order.name,
            drink: order.drink,
            sugar: order.sugar,
            ice: order.ice,
            quantity: order.quantity,
            price: singlePrice,
            totalPrice: order.totalPrice
          });
          
          addToast(`已載入 ${order.name} 於修改視窗`, "info");
          // Smooth scroll to form on small screens
          window.scrollTo({ top: 300, behavior: 'smooth' });
        };

        const handleCancelEdit = () => {
          setEditOrderId(null);
          setFormState(prev => ({
            ...prev,
            drink: "",
            price: 0,
            totalPrice: 0,
            quantity: 1,
            sugar: "半糖",
            ice: "少冰"
          }));
          addToast("已返回新建點單模式", "info");
        };

        // Form Delete item
        const handleDelete = async (orderId) => {
          setIsDeletingId(orderId);
          const payload = {
            action: "delete",
            data: { orderId }
          };

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === "success") {
              addToast("點單刪除成功！工作表已同步。", "success");
              fetchData();
              // If we were editing that specific deleted order, clear form
              if (editOrderId === orderId) {
                handleCancelEdit();
              }
            } else {
              addToast(`刪除失敗: ${result.message}`, "error");
            }
          } catch (err) {
            console.error("Delete error", err);
            addToast("連線後端錯誤。刪除作業未竟，請重試。", "error");
          } finally {
            setIsDeletingId(null);
          }
        };

        return (
          <div className="min-h-screen pb-16">
            
            {/* Header section with brand and description */}
            <header className="bg-gradient-to-r from-matcha-700 via-matcha-600 to-matcha-800 text-white shadow-premium select-none">
              <div className="max-w-7xl mx-auto px-4 py-8 md:py-10">
                <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                  
                  {/* Left Brand Area */}
                  <div className="flex items-center gap-4 text-center md:text-left">
                    <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20 shadow-inner group animate-bounce-slow flex items-center justify-center">
                      <div className="text-3xl text-matcha-100">🧋</div>
                    </div>
                    <div>
                      <h1 className="text-2xl md:text-3.5xl font-extrabold font-display tracking-tight text-white flex items-center gap-2 justify-center md:justify-start">
                        辦公室飲料揪團系統
                        <span className="text-stone-300 font-normal text-sm bg-stone-900/40 px-2.5 py-1 rounded-full hidden md:inline-block">
                          下午茶救星
                        </span>
                      </h1>
                      <p className="text-stone-200/95 text-xs md:text-sm font-medium mt-1.5 leading-relaxed tracking-wide">
                        凝聚辦公室的甜度小確幸！一鍵快速點單、Google Sheets 自動即時同步。
                      </p>
                    </div>
                  </div>

                  {/* Right Actions Area */}
                  <div className="flex items-center gap-3">
                    <div className="text-right hidden sm:block">
                      <span className="text-[10px] uppercase font-mono tracking-widest text-[#a3d1bb] block">
                        今日點單統計日
                      </span>
                      <span className="font-mono text-sm font-bold text-[#faf3e9] block mt-0.5">
                        {new Date().toISOString().split('T')[0]}
                      </span>
                    </div>

                    <button
                      onClick={() => fetchData(true)}
                      disabled={isLoading}
                      className="bg-white/10 hover:bg-white/20 backdrop-blur-sm border border-white/15 px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 transition-all active:scale-95 text-white cursor-pointer"
                    >
                      <Icon name={isLoading ? "loading" : "refresh"} className="w-4 h-4" />
                      {isLoading ? "載入中..." : "同步數據"}
                    </button>
                  </div>

                </div>
              </div>
            </header>

            {/* Main Application Interface */}
            <main className="max-w-7xl mx-auto px-4 mt-8">
              
              {/* Stats Cards Section */}
              <section className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                {/* Stat 1: Total Cups */}
                <div className="bg-white rounded-xl p-4 md:p-5 border border-slate-200 shadow-card flex items-center gap-3.5 smooth-transition hover:translate-y-[-2px]">
                  <div className="p-3 bg-matcha-50 text-matcha-600 rounded-xl flex items-center justify-center">
                    <Icon name="shoppingBag" className="w-5 h-5 md:w-6 md:h-6" />

                  <div>
                    <span className="text-[10px] md:text-xs text-slate-400 font-bold block select-none">今日總杯數</span>
                    <span className="text-lg md:text-2xl font-black text-slate-800 tracking-tight block mt-0.5">
                      {isLoading ? "---" : `${statistics.totalCups} 杯`}
                    </span>
                  </div>
                </div>

                {/* Stat 2: Total Amount */}
                <div className="bg-white rounded-xl p-4 md:p-5 border border-slate-200 shadow-card flex items-center gap-3.5 smooth-transition hover:translate-y-[-2px]">
                  <div className="p-3 bg-boba-50 text-boba-500 rounded-xl flex items-center justify-center">
                    <Icon name="dollarSign" className="w-5 h-5 md:w-6 md:h-6" />

                  <div>
                    <span className="text-[10px] md:text-xs text-slate-400 font-bold block select-none">今日累積金額</span>
                    <span className="text-lg md:text-2xl font-black text-slate-800 tracking-tight block mt-0.5">
                      {isLoading ? "---" : `NT$ ${statistics.totalAmount}`}
                    </span>
                  </div>
                </div>

                {/* Stat 3: Participants */}
                <div className="bg-white rounded-xl p-4 md:p-5 border border-slate-200 shadow-card flex items-center gap-3.5 smooth-transition hover:translate-y-[-2px]">

                    <span className="text-lg md:text-2xl font-black text-slate-800 tracking-tight block mt-0.5">
                      {isLoading ? "---" : `${statistics.peopleCount} 人`}

                  </div>

                <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-card flex items-center gap-3.5 smooth-transition hover:translate-y-[-2px] overflow-hidden">
                  <div className="p-3 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center">

                      {isLoading ? "---" : statistics.popularText}

                    </div>

                    {/* Category Filter Chips */}
                    <div className="flex items-center gap-1.5 overflow-x-auto pb-4 mb-4 select-none">
                      {menuCategories.map((cat) => {
                        const isSelected = selectedCategory === cat;
                        return (
                          <button
                            type="button"
                            key={cat}
                            onClick={() => setSelectedCategory(cat)}
                            className={`flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold leading-none tracking-wider transition-all sm:py-2 ${
                              isSelected 
                                ? 'bg-matcha-500 text-white shadow-sm scale-102' 
                                : 'bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100'
                            }`}
                          >
                            {cat}
                          </button>
                        );
                      })}
                    </div>

                    {/* Loaded Menu Grid Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[350px] overflow-y-auto pr-1.5">
                      {filteredMenu.length > 0 ? (
                        filteredMenu.map((bev) => {
                          const isSelected = formState.drink === bev.name;
                          return (
                            <div
                              key={bev.name}
                              onClick={() => handleSelectDrink(bev)}
                              className={`rounded-xl p-4 border text-left cursor-pointer smooth-transition group relative ${
                                isSelected 
                                  ? 'bg-[#ecfdf5] border-matcha-400 shadow-sm ring-1 ring-matcha-300' 
                                  : 'bg-slate-50 border-slate-200/60 hover:bg-slate-100/50 hover:border-slate-300'
                              }`}
                            >
                              <div className="flex justify-between items-start gap-2 mb-1.5">
                                <span className="font-extrabold text-slate-800 text-sm group-hover:text-matcha-700 smooth-transition">
                                  {bev.name}
                                </span>
                                <span className="font-mono text-xs font-bold text-matcha-600 min-w-max">
                                  ${bev.price}
                                </span>
                              </div>
                              <p className="text-[11px] text-slate-400 leading-relaxed font-medium line-clamp-2">
                                {bev.description || "辦公室高人氣招招牌，採用嚴選頂級調配茶味。"}
                              </p>
                              <div className="mt-2.5 flex items-center justify-between">
                                <span className="text-[9px] font-bold text-slate-450 uppercase tracking-widest px-1.5 py-0.5 bg-slate-100 rounded">
                                  {bev.category || "人氣經典"}
                                </span>
                                <span className={`text-[10px] items-center gap-1 font-bold group-hover:flex ${isSelected ? 'flex text-matcha-600' : 'hidden text-slate-400'}`}>
                                  點選入單 <span className="text-xs">➔</span>
                                </span>
                              </div>
                            </div>
                          )
                        })
                      ) : (
                        <div className="col-span-full py-8 text-center text-slate-400 text-xs">
                          沒有找到相符的特色飲品，要不要換個關鍵詞搜尋？
                        </div>
                      )}
                    </div>
                  </section>

                  {/* Part 2: Active Orders lists segment */}
                  <section className="bg-white rounded-2xl p-6 shadow-premium border border-slate-200">
                    <div className="flex items-center justify-between mb-5 select-none">
                      <div className="flex items-center gap-2 pl-3 border-l-4 border-matcha-500">
                        <h2 className="text-lg font-bold tracking-tight text-slate-800">
                          📋 今日點單列表
                        </h2>
                      </div>
                      <span className="text-xs text-slate-400 font-mono font-bold">
                        今日累積共: <span className="text-slate-700">{orders.length} 筆</span>
                      </span>
                    </div>

                    {/* Skeletons on loading, or loaded custom list rendered below */}
                    {isLoading ? (
                      <div className="space-y-3">
                        {[1, 2, 3].map((idx) => (
                          <div key={idx} className="animate-pulse bg-stone-50 border border-stone-100 p-4 rounded-2xl flex items-center justify-between">
                            <div className="flex items-center gap-3 w-2/3">
                              <div className="w-10 h-10 rounded-full bg-stone-200"></div>
                              <div className="space-y-2 flex-grow">
                                <div className="h-4 bg-stone-200 rounded w-1/3"></div>
                                <div className="h-3 bg-stone-200 rounded w-1/2"></div>
                              </div>
                            </div>
                            <div className="h-6 bg-stone-200 rounded w-16"></div>
                          </div>
                        ))}
                      </div>
                    ) : orders.length > 0 ? (
                      <div className="space-y-3 max-h-[450px] overflow-y-auto pr-1">
                        {orders.map((order) => (
                          <OrderItem
                            key={order.orderId}
                            order={order}
                            onEdit={handleEdit}
                            onDelete={handleDelete}
                            isDeletingId={isDeletingId}
                          />
                        ))}
                      </div>
                    ) : (
                      /* Highlight Empty State Design */
                      <div className="border-2 border-dashed border-stone-100 rounded-3xl p-8 py-12 text-center select-none bg-stone-50/40">
                        <div className="text-5xl animate-bounce-slow filter drop-shadow">🧋</div>
                        <h4 className="text-base font-bold text-stone-700 tracking-tight mt-5">
                          目前還沒有任何人點單唷！
                        </h4>
                        <p className="text-stone-400 text-xs mt-1.5 max-w-sm mx-auto leading-relaxed">
                          不要再猶豫了，快使用左邊的表單填寫或在飲料菜單中直接點擊，成為今日揪團發起的第一位品嚐者吧！
                        </p>
                        <div className="mt-5">
                          <span className="inline-flex items-center gap-1.5 text-[10px] font-extrabold uppercase tracking-widest text-[#1e6b4e] bg-[#e1f0e8] px-3.5 py-1.5 rounded-full">
                            ✨ 點單帶動辦公室活力 ✨
                          </span>
                        </div>
                      </div>
                    )}
                  </section>
                  
                </div>

              </div>
            </main>

            {/* Custom Interactive Toasts rendering container */}
            <ToastContainer toasts={toasts} removeToast={removeToast} />
            
            {/* Minimal aesthetic Footer */}
            <footer className="mt-20 text-center select-none">
              <p className="text-xs text-stone-400 font-medium">
                辦公室飲料揪團系統 © 2026 Afternoon Tea Ordering Co.
              </p>
              <div className="mt-2 flex items-center justify-center gap-1.5 text-[10px] text-stone-400 font-bold uppercase tracking-wider">
                <span>自動儲存姓名</span>
                <span>•</span>
                <span>即時 Google Sheets 人流同步</span>
              </div>
            </footer>

          </div>
        );
      }

      // Render App inside root DOM element
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
